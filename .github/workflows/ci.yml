# Lint and tests on every PR and on main. The job name `ci` is the required status check
# in the main ruleset (ADR-0003). CI never calls A-1 or job boards and has no secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          .devcontainer/install-gitleaks.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: scripts/lint.sh

      - name: Test
        run: scripts/test.sh
