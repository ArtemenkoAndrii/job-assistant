# Lint and tests on every PR and on main. The job name `ci` is the required status check
# in the main ruleset (ADR-0003). CI never calls A-1 or job boards and has no secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          .devcontainer/install-gitleaks.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv and Python
        run: |
          python3 -m pip install --user "uv==0.13.9"
          uv python install "$(cat apps/jobfinder/.python-version)"

      - name: Install Terraform
        run: |
          .devcontainer/install-terraform.sh "$HOME/.local/bin"

      - name: Terraform format and validate (no backend, no cloud)
        run: |
          terraform fmt -check -recursive infra
          for layer in platform app; do
            terraform -chdir=infra/$layer init -backend=false -input=false
            terraform -chdir=infra/$layer validate
          done

      - name: Build
        run: scripts/build.sh

      - name: Lint
        run: scripts/lint.sh

      - name: Test
        run: scripts/test.sh

      - name: Dependency audit
        run: scripts/audit.sh

      - name: Build container image
        run: docker build --tag jobfinder:ci apps/jobfinder

      - name: Smoke test the image
        run: |
          docker run --rm jobfinder:ci python -m jobfinder.worker
          docker run -d --name web -p 8080:8080 jobfinder:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          docker rm -f web
