<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Finder{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/profiles">Job Finder</a>
    <nav aria-label="Main">
      {% for key, label, url in nav %}
      <a href="{{ url }}"{% if key == current %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <a class="signout" href="/_gcp_iap/clear_login_cookie">Sign out</a>
  </header>
  <main>
    <h1>{% block heading %}{% endblock %}</h1>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
